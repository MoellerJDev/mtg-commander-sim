name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      MTG_CARD_DB: data/test-ci.sqlite3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development checks
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build
          --fixture tests/fixtures/scryfall-exact-lists.json
          --output data/test-ci.sqlite3
      - name: Compile
        run: python -m compileall -q mtg_commander_sim tests scripts simctl.py
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate repository and history policy
        run: python scripts/validate_repository.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify clean wheel installation and CLI
        run: python scripts/verify_wheel.py
