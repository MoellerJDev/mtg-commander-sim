name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      MTG_CARD_DB: data/test-ci.sqlite3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development checks
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build
          --fixture tests/fixtures/scryfall-exact-lists.json
          --fixture tests/fixtures/browser-lifecycle-cards.json
          --output data/test-ci.sqlite3
      - name: Compile
        run: python -m compileall -q mtg_commander_sim tests scripts simctl.py
      - name: Test
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify generated capability evidence
        run: python scripts/update_capability_evidence.py --check
      - name: Verify module classifications
        run: python scripts/update_module_classifications.py --check
      - name: Verify continuous-effect work budget
        run: python scripts/benchmark_continuous_effects.py --check
      - name: Verify generated platform status
        run: python scripts/update_platform_status.py --check
      - name: Verify pinned rules corpus
        run: python simctl.py rules verify --root .
      - name: Validate repository and history policy
        run: python scripts/validate_repository.py
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify clean wheel installation and CLI
        run: python scripts/verify_wheel.py

  web:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    env:
      MTG_CARD_DB: data/test-ci.sqlite3

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install server and browser dependencies
        run: |
          python -m pip install -e . -r requirements-dev.txt
          npm ci --prefix web
      - name: Build compact offline card database
        run: >-
          python scripts/build_test_database.py build
          --fixture tests/fixtures/scryfall-exact-lists.json
          --fixture tests/fixtures/browser-lifecycle-cards.json
          --output data/test-ci.sqlite3
      - name: Verify generated protocol types
        run: |
          npm run generate:types --prefix web
          git diff --exit-code -- web/src/generated
      - name: Typecheck and build browser
        run: npm run build --prefix web
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Four-context browser test
        run: npm run e2e --prefix web
