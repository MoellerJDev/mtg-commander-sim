[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quorune"
version = "0.9.0"
description = "Deterministic, server-authoritative multiplayer card-game platform with private state and exact replay"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{name = "MoellerJDev"}]
maintainers = [{name = "MoellerJDev"}]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "websockets>=16,<18",
]

[project.urls]
Repository = "https://github.com/MoellerJDev/quorune"
Issues = "https://github.com/MoellerJDev/quorune/issues"
Documentation = "https://github.com/MoellerJDev/quorune#readme"

[project.scripts]
quorune = "quorune.cli:main"
simctl = "quorune.cli:main"
quorune-server = "server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quorune*", "server*"]

[tool.setuptools.package-data]
quorune = [
  "deck_profiles/*.json",
  "rules/*.json",
  "semantic_packs/*.json",
  "schemas/*.json"
]
