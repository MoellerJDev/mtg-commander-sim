[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-commander-sim"
version = "0.7.0"
description = "Persistent, permission-scoped multiplayer Commander simulation for LLM pilots"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OpenAI"}]
dependencies = []

[project.scripts]
mtg-commander-sim = "mtg_commander_sim.cli:main"
simctl = "mtg_commander_sim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtg_commander_sim*"]

[tool.setuptools.package-data]
mtg_commander_sim = ["deck_profiles/*.json", "semantic_packs/*.json"]
