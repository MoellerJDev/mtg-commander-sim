[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtg-commander-sim"
version = "0.8.0"
description = "Deterministic, server-authoritative multiplayer Commander platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "OpenAI"}]
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "websockets>=16,<18",
]

[project.scripts]
mtg-commander-sim = "mtg_commander_sim.cli:main"
simctl = "mtg_commander_sim.cli:main"
commander-server = "server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mtg_commander_sim*", "server*"]

[tool.setuptools.package-data]
mtg_commander_sim = [
  "deck_profiles/*.json",
  "rules/*.json",
  "semantic_packs/*.json",
  "schemas/*.json"
]
